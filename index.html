<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>World Cup Field</title>
<style>
    :root {
      --green: #1f7a3f;
      --green-deep: #0b5c29;
      --line: #ffffff;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1c3d5d 0%, #0e1722 45%, #070d13 100%);
      color: #fff;
      overflow: hidden;
    }

    .wrap {
      width: min(96vw, 1100px);
      text-align: center;
      justify-items: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }

    p {
      margin: 0 0 16px;
      color: #dff5ea;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
    }

    #pitch {
      position: relative;
      width: 100%;
      aspect-ratio: 1.5 / 1;
      max-height: 78vh;
      margin: 0 auto;
      border: 6px solid #fff;
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.08)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 18px),
        linear-gradient(135deg, #2aa154 0%, #1b7c40 45%, #146733 100%);
      box-shadow: 0 18px 40px var(--shadow);
    }

    .pitch::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08) 0 6%, transparent 7% 100%);
      opacity: 0.45;
      pointer-events: none;
    }
      

    .line {
      position: absolute;
      border: 2px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .touchline { inset: 3% 3%; }
    .goal-line { inset: 3% 3%; }

    .center-circle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 2px solid var(--line);
      border-radius: 50%;
    }
/*
    .center-spot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--line);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.1);
    }*/

    .penalty-box-left,
    .penalty-box-right,
    .goal-box-left,
    .goal-box-right {
      width: 24%;
      height: 42%;
      top: 29%;
      border-color: var(--line);
    }

    .penalty-box-left { left: 3%; }
    .penalty-box-right { right: 3%; }

    .goal-box-left,
    .goal-box-right {
      width: 12%;
      height: 22%;
      top: 39%;
      border-color: var(--line);
    }

    .goal-box-left { left: 3%; border-left: 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
    .goal-box-right { right: 3%; border-right: 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
/*
    .penalty-spot-left,
    .penalty-spot-right {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--line);
      transform: translateY(-50%);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
    }

    /*.penalty-spot-left { left: 24%; }
    .penalty-spot-right { right: 24%; }*/

    .midline {
      left: 50%;
      top: 3%;
      bottom: 3%;
      width: 0;
      transform: translateX(-50%);
    }

    .goal-post-left,
    .goal-post-right {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 88px;
      background: #fff;
      transform: translateY(-50%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }

    .goal-post-left { left: 0; }
    .goal-post-right { right: 0; }

    .label {
      position: absolute;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(7, 13, 19, 0.65);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #efffff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .label.top { top: 10px; left: 50%; transform: translateX(-50%); }
    .label.bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
      color: #efffff;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .pitch { border-width: 4px; border-radius: 12px; }
      .goal-post-left, .goal-post-right { height: 64px; }
      .label { font-size: 0.75rem; }
    }
      #Soccerballenvelope  {
      position: relative;
      top: 37vh;
      left: 3hw;
      display: flex;
      align-items: center;
      justify-content:center;
      width: 3.8vh;
      height: 3ch;
      z-index: 10;
      transition: transform 0.15s cubic-bezier(0.445, 0.05, 0.55, 0.95) /* cubic-bezier it is a polish version of ease-in-out;*/ 
      }
    .ball {
      position: absolute;
      width: inherit;
      height: inherit;
      background: radial-gradient(circle at center, #fff 0%, #e0e0e0 60%, #c0c0c0 100%);
      border-radius: 50%;
      box-shadow: inset -4px -4px 8px rgba(255,255,255,0.6), inset 4px 4px 8px rgba(0,0,0,0.2);
      
       box-shadow: 0 6px 5px rgba(0,0,0,0.25);
    }

    .pentagon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle at center, #000 0%, #333 60%, #111 100%);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      transform: translate(-50%, -50%);
    }

     .pentagon::after {
      content: "";
      position: absolute;
      top: 60%;
      left: 60%;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle at center, #000 0%, #333 60%, #111 100%);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      transform: rotate(30deg);
      transform: translate(-70%, -70%);
      
      z-index: 3;
    }
 
     #goalMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      /*display: none; */
      z-index: 1000;}
      /* Initially hidden */
     
  </style> 
</head>
<body>
 
  <main class="wrap">
    
     <div id="Soccerballenvelope">
    <div class="ball">
      <div class="pentagon"></div>
     </div>
  </div>
 <div id="goalMessage"></div>


  <script>
    /*const fieldSize = document.querySelector(".pitch").offsetWidth;*/

    const soccerBall = document.getElementById("Soccerballenvelope");
    const moveDistance = () => Math.round(document.querySelector("#pitch").offsetWidth * 0.1); // Maximum distance the ball can move in pixels


    // Initialize  position of the ball if offsetWidth and offsetHeight are not working, we can use getBoundingClientRect() to get the position of the ball relative to the pitch, and then use that to set the initial position of the ball.
   let currentX = 0;
    let currentY = 0;
   //currentX = document.body.offsetWidth("Soccerballenvelope") ;
  
   //currentY = document.body.offsetHeight("Soccerballenvelope") ;

   
    // Set the initial position of the ball to the center of the pitch
    soccerBall.style.transform = `translate(${currentX}px, ${currentY}px)`;

  
  


  

      soccerBall.addEventListener("click", () => {
      const randomAngle = Math.random() * 2 * Math.PI;

      const ballRect = soccerBall.getBoundingClientRect();

      const newX = Math.cos(randomAngle) * moveDistance();
      const newY = Math.sin(randomAngle) * moveDistance();


      const pitch = document.querySelector("#pitch");
      const maxX = pitch.offsetWidth - ballRect.width ;
      const maxY = pitch.offsetHeight - ballRect.height;

      if (currentX + newX < 0 || currentX + newX > maxX) {
        return; // Prevent moving out of bounds horizontally
      }
      if (currentY + newY < 0 || currentY + newY > maxY) {
        return; // Prevent moving out of bounds vertically
      }

function showMessage(message) {
  const box = document.getElementById("goalMessage");
  box.textContent = message;
  box.style.fontSize = "2rem";
  box.style.fontWeight = "bold";
  box.style.fontFamily = "Arial, sans-serif";

  box.style.display = "block";
  setTimeout(() => {
    box.style.display = "none";
  }, 3000);
}
/*
        if (currentY == maxY/2)  // Check if the ball is at the center of the pitch
      {
        if (currentX <= 0.8)
        {
          showMessage("Auto Goal! "); // Ball is at the left goal line
        }
        if (currentX >= maxX - 0.8) 
          showMessage("Goal! "); // Ball is at the right goal line
      
        }*/
       
      
const goalRect = document.querySelector(".goal-post-left").getBoundingClientRect();
const autoGoalRect = document.querySelector(".goal-post-right").getBoundingClientRect();

if (ballRect.right >= goalRect.left &&
    ballRect.left <= goalRect.right &&
    ballRect.bottom >= goalRect.top &&
    ballRect.top <= goalRect.bottom) {
  showMessage("GOAL!");
}
if (ballRect.right <= autoGoalRect.left &&
    ballRect.left >= autoGoalRect.right &&
    ballRect.bottom <= autoGoalRect.top &&
    ballRect.top >= autoGoalRect.bottom) {
  showMessage("AUTO GOAL!");
}
// evalute if ball is outside the pitch

       currentX += newX;
      currentY += newY;// this isn't working as expected, because the ball is not moving outside the pitch, but it is moving to the edge of the pitch, so we need to check if the ball is at the edge of the pitch, and if it is, we need to show a message that says "Out of bounds!" and reset the ball position to the center of the pitch.
            // Update the ball's position using CSS transform. why it is better than changing left and top properties: because transform is more performant and smoother for animations, as it doesn't trigger reflows and repaints in the browser.
            /*why is a delay in the movement of the ball when using transform: because the transition property is set on the soccerBall element, which causes the movement to be animated over a duration of 0.2 seconds with a cubic-bezier easing function. This creates a smooth transition effect when the ball moves to its new position.*/
      soccerBall.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }
      )

  </script>

    <!--<h1>World Cup Field</h1> 
   <p></p> -->

    <section id="pitch" >
      <div class="line touchline"></div>
      <div class="line midline"></div>
      <div class="line penalty-box-left"></div>
      <div class="line penalty-box-right"></div>
      <div class="line goal-box-left"></div>
      <div class="line goal-box-right"></div>
      <div class="center-circle"></div>
      <div class="center-spot"></div>
      <div class="penalty-spot-left"></div>
      <div class="penalty-spot-right"></div>
      <div class="goal-post-left"></div>
      <div class="goal-post-right"></div>
      <div class="label top">FIFA</div>
      <div class="label bottom">Match Day</div>
    </section>

   <!-- <span class="badge">Ready to play</span> -->
  </main>
</body>
</html>
